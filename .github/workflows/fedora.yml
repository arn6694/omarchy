name: Fedora port checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build tools
        run: dnf -y install git rpm-build bash findutils coreutils grep gawk tar gzip nodejs python3 jq util-linux
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve upstream hotkeys and cheat sheet
        run: python3 test/fedora-hotkeys.py
      - name: Fedora runtime isolation
        run: python3 test/fedora-runtime.py
      - name: Shell syntax
        run: bash test/fedora-syntax.sh
      - name: DNF helper behavior
        run: bash test/shell.d/fedora-packages-test.sh
      - name: CLI regressions
        run: bash test/cli
      - name: Build RPM
        run: bash packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: omarchedora-fedora44
          path: build/RPMS/noarch/*.rpm
